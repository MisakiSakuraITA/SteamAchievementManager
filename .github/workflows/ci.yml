name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test (Release, x86)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore SAM.sln

      # The solution only declares an x86 platform (steamclient.dll is a 32-bit native
      # module), so Platform=x86 is spelled out explicitly rather than left to inference.
      - name: Build
        run: dotnet build SAM.sln --configuration Release --no-restore /p:Platform=x86

      - name: Test
        run: dotnet test SAM.sln --configuration Release --no-build --verbosity normal
