name: Feature Request
description: Propose a new feature or quality-of-life improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe what you'd like to see and why it would
        help.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that SAM doesn't currently support well?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What would you like SAM to do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches or workarounds you've tried or thought about.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app does this mostly touch?
      options:
        - Game Picker (SAM.Picker)
        - Achievement Manager (SAM.Game)
        - Shared UI / theme (SAM.UI)
        - Caching / performance (SAM.Core)
        - Steam interop (SAM.API)
        - Not sure
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, or links to anything similar in another tool.
    validations:
      required: false
